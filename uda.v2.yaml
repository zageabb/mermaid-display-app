# V2 review candidate; no activation authority
schema_version: 2
application:
  name: mermaid-display-app
  kind: web
  display_name: "Mermaid Display App"
  group: "TAIJU - Development"
source:
  branch: main
  repository: "zageabb/mermaid-display-app"
builds:
  - name: build
    toolchain: python
    working_dir: "."
    commands:
      - ["python","-m","pip","install","-r","requirements.txt","gunicorn"]
services:
  - name: web
    role: web
    runtime: python
    runtime_version: "3.10.12"
    working_dir: "."
    entrypoint: ["gunicorn","--workers","2","--timeout","300","--bind","0.0.0.0:5070","app:app"]
    port: 5070
    health:
      type: http
      path: "/"
    restart: on-failure
    required_builds: [build]
proxy:
  enabled: true
  upstream: web
  canonical_path: /apps/mermaid-display-app/
  authentication: uda
environment:
  required: ["MERMAID_EDITOR_URL"]
deployment:
  strategy: systemd
  approval: explicit
  auto_update: false
  rollback: true
  github_reporting: false
